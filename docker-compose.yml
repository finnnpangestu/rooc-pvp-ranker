services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    # Otomatis deteksi lockfile: jika ada pnpm-lock.yaml gunakan pnpm, jika ada package-lock.json gunakan npm
    command: sh -c "if [ -f pnpm-lock.yaml ]; then corepack enable pnpm && pnpm install && pnpm dev; else npm install && npm run dev; fi"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=development

  # Service database PostgreSQL lokal
  # Jika menggunakan Supabase cloud, service ini bisa di-skip atau diabaikan
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-guild-management}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guild-management}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  node_modules:
